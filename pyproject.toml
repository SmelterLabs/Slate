[project]
name = "slate"
version = "0.1.0"
description = "Slate: an agent-native task board"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Floors are the versions uv.lock pins and the tests run; a cap keeps the next major (the next
# minor for SQLAlchemy, 1.0 for a 0.x package) out of a wheel install until it is tested.
dependencies = [
    "fastapi>=0.161.1,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "sqlalchemy>=2.1.6,<2.2",
    "alembic>=1.20.1,<2",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "python-dateutil>=3.0.0,<4",
    "httpx>=0.28.1,<1",
    "sse-starlette>=3.6.0,<4",
    "mcp>=2.3.0,<3",
    "tzdata>=2026.5",
    "cryptography>=50.0.2,<51",
    "openpyxl>=3.1.5,<4",
    "pypdf>=6.21.4,<7",
]

[project.scripts]
slate = "slate.cli:main"
slate-mcp = "slate.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.5",
    "freezegun>=1.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slate"]
exclude = ["src/slate/static", "src/slate/build.json"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "slate/migrations"

# A Python sdist is not a repository backup: never sweep in local credentials,
# frontend dependencies, generated assets or nested worktrees.
[tool.hatch.build.targets.sdist]
only-include = ["src/slate", "alembic", "alembic.ini", "README.md", "pyproject.toml", "uv.lock"]
exclude = ["src/slate/static", "src/slate/build.json", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:slate.*"]
markers = ["perf: timing tests; skip with -m \"not perf\""]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
