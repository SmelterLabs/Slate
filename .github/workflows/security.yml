# Secrets are checked on pull requests and direct pushes. Code review scans PR changes.
name: security
on:
  workflow_dispatch:   # run by hand from the Actions tab
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  secrets:
    name: leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable history for passwords, keys and tokens
        run: |
          # The release's published SHA-256; a different download stops here.
          curl -sSfL -o gitleaks_8.21.2_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks_8.21.2_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1
  code:
    if: github.event_name == 'pull_request'
    name: security mistakes (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the PR's changes for common security mistakes
        run: |
          pip install --quiet semgrep==1.185.0
          semgrep scan --config p/default --baseline-commit "${{ github.event.pull_request.base.sha }}" --error --metrics off
