name: ci

on:
  workflow_dispatch:   # run by hand from the Actions tab
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only everywhere. Each checkout drops the token afterwards (persist-credentials: false), so
# the tests, npm's install scripts and the e2e run never see one. Actions are pinned by commit;
# Dependabot (.github/dependabot.yml) moves the pins.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Optional adapters (AGENTS.md rule 5): tested on their own; Slate's tests never need them.
      - run: if [ -d integrations ]; then uv run pytest -q integrations; fi

  # The maintainers' denylist is a repository secret, never a file in the repo (AGENTS.md rule 9).
  # It is only ever handed to the base branch's copy of the checker, run with the system Python
  # on the change's files and commit messages as data: no code from the change runs in this job,
  # so a pull request cannot print the list. Forks get no secrets, so it is skipped there.
  private-terms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the change, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the checker from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: private-terms check
        env:
          PRIVATE_TERMS_SHA256: ${{ secrets.PRIVATE_TERMS_SHA256 }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # The checker also scans the local Git identity; CI's own is a masked address.
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@users.noreply.github.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@users.noreply.github.com
        run: |
          if [ -z "$PRIVATE_TERMS_SHA256" ]; then
            echo "no denylist secret in this run; skipped"
            exit 0
          fi
          export SLATE_PRIVATE_TERMS_FILE="$RUNNER_TEMP/private_terms.sha256"
          printf '%s\n' "$PRIVATE_TERMS_SHA256" > "$SLATE_PRIVATE_TERMS_FILE"
          # The checker scans the tree it sits in, so the trusted copy goes inside the change's
          # tree, in a folder the change cannot already have (mkdir fails if it exists).
          mkdir pr/.trusted
          cp trusted/scripts/check_private_terms.py pr/.trusted/
          python3 -I pr/.trusted/check_private_terms.py
          # Each new commit's message and author and committer addresses (GitHub's masked
          # noreply addresses are public by design and left out).
          case "$BASE" in ""|0000000000000000000000000000000000000000) exit 0 ;; esac
          git -C pr log --format='%B%n%ae%n%ce' "$BASE..$HEAD" \
            | grep -viE '^([0-9]+\+)?[a-z0-9-]+@users\.noreply\.github\.com$' \
            > "$RUNNER_TEMP/commits.txt" || true
          python3 -I pr/.trusted/check_private_terms.py --message "$RUNNER_TEMP/commits.txt"

  # Slate under load (scripts/load_test.py --ci): a 5,000-item board, five agents checking in
  # and writing in batches, two boards on the live stream. Fails when a number in
  # bench/budgets.json is broken; the numbers are kept as an artifact. docs/PERFORMANCE.md.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run python scripts/load_test.py --ci --json bench-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-result
          path: bench-result.json
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The e2e tests start a real Slate server (uv run slate serve).
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Chromium is cached per Playwright version. Its system libraries come from apt, whose
      # mirrors fail now and then: apt retries each download, and the whole install is retried.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium and its system libraries
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            if npx playwright install chromium && npx playwright install-deps chromium; then
              exit 0
            fi
            echo "install attempt $attempt failed; retrying" >&2
            sleep 20
          done
          exit 1
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
