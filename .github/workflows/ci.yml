name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # The maintainers' denylist is a repository secret, never a file in the repo (AGENTS.md
      # rule 9). Pull requests from forks get no secrets, so there is nothing to check there.
      - name: private-terms check
        env:
          PRIVATE_TERMS_SHA256: ${{ secrets.PRIVATE_TERMS_SHA256 }}
        run: |
          if [ -z "$PRIVATE_TERMS_SHA256" ]; then
            echo "no denylist secret in this run; skipped"
            exit 0
          fi
          printf '%s\n' "$PRIVATE_TERMS_SHA256" > "$RUNNER_TEMP/private_terms.sha256"
          SLATE_PRIVATE_TERMS_FILE="$RUNNER_TEMP/private_terms.sha256" uv run python scripts/check_private_terms.py
      # Optional adapters (AGENTS.md rule 5): tested on their own; Slate's tests never need them.
      - run: if [ -d integrations ]; then uv run pytest -q integrations; fi

  # Slate under load (scripts/load_test.py --ci): a 5,000-item board, five agents checking in
  # and writing in batches, two boards on the live stream. Fails when a number in
  # bench/budgets.json is broken; the numbers are kept as an artifact. docs/PERFORMANCE.md.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run python scripts/load_test.py --ci --json bench-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-result
          path: bench-result.json
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The e2e tests start a real Slate server (uv run slate serve).
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  image:
    needs: [test, bench, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the image's rev is the commit count; a shallow clone would say 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io wants a lowercase name; the image is published under this repository's owner.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
