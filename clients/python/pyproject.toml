# The Slate runner and Python client as an installable tool, separate from the server:
#   uv tool install "git+https://github.com/SmelterLabs/Slate#subdirectory=clients/python"
#   slate-runner --config runner.toml
# Its version follows RUNNER_PROTOCOL (slate_runner.py): 0.<protocol>.<patch>. Install the
# release that matches your server; an older runner is refused with a 426 telling it to update.
[project]
name = "slate-runner"
dynamic = ["version"]
description = "Run AI agents' Slate tasks: watch the board, start the agent, report back"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
slate-runner = "slate_runner:main"
slate-connect = "slate_connect:main"
slate-runner-assets = "slate_runner_assets.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "slate_runner.py"

[tool.hatch.build.targets.wheel]
only-include = ["slate_runner.py", "slate_client.py", "slate_connect.py", "slate_runner_assets"]

[tool.hatch.build.targets.sdist]
only-include = [
    "slate_runner.py", "slate_client.py", "slate_connect.py", "README.md", "runner.example.toml",
    "slate_runner_assets", "hatch_build.py", "run_one_example.py",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
